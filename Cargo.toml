[package]
name = "chase-cli"
version = "0.2.0"
edition = "2021"
# pk-cli-auth (cli-common v0.21.0) needs 1.89.
rust-version = "1.89"
description = "Offline-first CLI for Chase card and bank activity: parse Chase CSV exports into the piekstra family transaction DTO, and scan a directory for Chase-shaped exports."
license = "MIT"
repository = "https://github.com/piekstra/chase-cli"
homepage = "https://github.com/piekstra/chase-cli"
readme = "README.md"
keywords = ["chase", "csv", "transactions", "finance", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "chse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0", features = ["stdio", "http"] }
schemars = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Also a runtime dependency; the fixture-policy test needs it to read the
# Description column out of the fixtures themselves.
csv = "1"
# `conformance`, the checks every family MCP server is held to.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0", features = ["test-util"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
